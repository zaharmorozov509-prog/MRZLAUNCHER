<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>MRZLAUNCHER</title>
<style>
:root {
  --bg1: #1a1a3e; --bg2: #2d1b4e; --bg3: #0d0d1a;
  --glass: rgba(255,255,255,0.12);
  --glass-heavy: rgba(255,255,255,0.18);
  --border: rgba(255,255,255,0.25);
  --text: #ffffff; --dim: rgba(255,255,255,0.6);
  --accent: #8b5cf6;
  --shadow: 0 12px 40px rgba(0,0,0,0.4);
  --radius: 24px;
}
[data-theme="light"] {
  --bg1: #e0e7ff; --bg2: #f0f4ff; --bg3: #dbeafe;
  --glass: rgba(255,255,255,0.55);
  --glass-heavy: rgba(255,255,255,0.75);
  --border: rgba(255,255,255,0.8);
  --text: #1e1b4b; --dim: rgba(30,27,75,0.6);
  --accent: #6d28d9;
  --shadow: 0 12px 40px rgba(30,27,75,0.15);
}
[data-theme="amoled"] {
  --bg1: #000; --bg2: #050505; --bg3: #000;
  --glass: rgba(255,255,255,0.08);
  --glass-heavy: rgba(255,255,255,0.12);
  --border: rgba(255,255,255,0.15);
  --text: #fff; --dim: rgba(255,255,255,0.5);
  --accent: #a78bfa;
  --shadow: 0 12px 40px rgba(0,0,0,0.8);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  background: linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3));
  background-size: 200% 200%;
  animation: bgShift 20s ease infinite;
  color: var(--text);
  overflow: hidden; /* Отключаем скролл страницы, листаем через JS */
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  transition: background 0.5s;
}
@keyframes bgShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }

/* ===== Экран блокировки ===== */
.lock {
  position: fixed; inset: 0; z-index: 200;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(180deg, rgba(15,12,41,0.7), rgba(36,36,62,0.9));
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  transition: transform 0.6s cubic-bezier(0.4,0,0.2,1), opacity 0.6s;
  cursor: pointer;
}
.lock.hidden { transform: translateY(-100%); opacity: 0; pointer-events: none; }
.lock-time { font-size: 6.5rem; font-weight: 200; letter-spacing: -4px; line-height: 1; }
.lock-date { font-size: 1.2rem; color: var(--dim); margin-top: 8px; }
.lock-hint { position: absolute; bottom: 60px; font-size: 0.9rem; color: var(--dim); animation: pulse 2s ease infinite; }
@keyframes pulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

/* ===== Главный экран (свайпалка) ===== */
.screen-container {
  position: relative; width: 100vw; height: 100vh;
  display: flex; flex-direction: column;
}
.pages-wrapper {
  flex: 1; display: flex;
  overflow: hidden;
  transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
}
.page {
  flex: 0 0 100vw; height: 100%;
  padding: 20px 24px 120px; /* Отступ снизу под док */
  overflow-y: auto; overflow-x: hidden;
  display: flex; flex-direction: column; gap: 24px;
  scrollbar-width: none;
}
.page::-webkit-scrollbar { display: none; }

/* ===== Виджеты ===== */
.widgets {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  width: 100%;
}
@media (max-width: 500px) { .widgets { grid-template-columns: 1fr; } }

.widget {
  background: var(--glass); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px;
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
  box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 16px;
  animation: floatIn 0.6s ease backwards;
}
@keyframes floatIn { from{opacity:0;transform:translateY(15px)} to{opacity:1;transform:translateY(0)} }
.widget-clock { flex-direction: column; align-items: flex-start; gap: 4px; }
.widget-time { font-size: 3.2rem; font-weight: 700; letter-spacing: -2px; line-height: 1; }
.widget-date { font-size: 0.95rem; color: var(--dim); }
.w-icon { font-size: 2.8rem; }
.w-temp { font-size: 1.8rem; font-weight: 700; line-height: 1; }
.w-city { font-size: 0.85rem; color: var(--dim); margin-top: 6px; }

/* ===== Сетка приложений ===== */
.app-grid {
  display: grid;
  gap: 20px;
  grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
}
@media (min-width: 600px) { .app-grid { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 24px; } }
@media (min-width: 900px) { .app-grid { grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 32px; } }

.app-item {
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  cursor: pointer;
  animation: pop 0.4s ease backwards;
  transition: transform 0.15s;
}
.app-item:active { transform: scale(0.88); }
@keyframes pop { from{opacity:0;transform:scale(0.7) translateY(10px)} to{opacity:1;transform:scale(1) translateY(0)} }

.app-icon {
  width: 72px; height: 72px; border-radius: 20px;
  display: grid; place-items: center; overflow: hidden;
  background: var(--glass); border: 1px solid var(--border);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  transition: transform 0.25s, box-shadow 0.25s;
}
.app-icon img { width: 100%; height: 100%; object-fit: cover; }
.app-icon .fallback { font-size: 2rem; }
@media (min-width: 900px) { .app-icon { width: 84px; height: 84px; border-radius: 24px; } .app-icon .fallback { font-size: 2.5rem; } }

.app-item:hover .app-icon { transform: translateY(-5px) scale(1.05); box-shadow: 0 16px 40px rgba(139,92,246,0.45); }

.app-name { font-size: 0.75rem; text-align: center; color: var(--text); opacity: 0.9; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ===== Поиск (выезжает сверху) ===== */
.search-overlay {
  position: fixed; inset: 0; z-index: 50;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(10px);
  display: flex; flex-direction: column; align-items: center; padding-top: 120px;
  opacity: 0; pointer-events: none; transition: opacity 0.3s;
}
.search-overlay.open { opacity: 1; pointer-events: auto; }
.search-box {
  width: 90%; max-width: 600px;
  background: var(--glass-heavy); border: 1px solid var(--border);
  border-radius: 20px; padding: 18px 24px;
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  display: flex; align-items: center; gap: 12px;
  transform: translateY(-20px); transition: transform 0.3s;
}
.search-overlay.open .search-box { transform: translateY(0); }
.search-box input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 1.1rem;
}
.search-box input::placeholder { color: var(--dim); }
.search-results {
  width: 90%; max-width: 600px; margin-top: 20px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 16px;
  max-height: 50vh; overflow-y: auto;
}

/* ===== Док ===== */
.dock-wrapper {
  position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); left: 0; right: 0;
  display: flex; justify-content: center; pointer-events: none;
}
.dock {
  display: flex; gap: 20px; padding: 16px 24px; border-radius: 32px;
  background: var(--glass); border: 1px solid var(--border);
  backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
  box-shadow: var(--shadow); pointer-events: auto;
}
.dock .app-icon { width: 56px; height: 56px; border-radius: 16px; }
.dock .app-name { display: none; }

/* ===== Индикатор страниц ===== */
.page-dots {
  position: fixed; bottom: calc(100px + env(safe-area-inset-bottom)); left: 0; right: 0;
  display: flex; justify-content: center; gap: 8px; pointer-events: none;
}
.page-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); transition: background 0.3s, transform 0.3s; }
.page-dot.active { background: #fff; transform: scale(1.3); }

/* ===== FAB (Настройки) ===== */
.fab {
  position: fixed; bottom: calc(100px + env(safe-area-inset-bottom)); right: 24px;
  width: 52px; height: 52px; border-radius: 50%;
  border: 1px solid var(--border); background: var(--glass);
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  color: var(--text); font-size: 1.4rem; cursor: pointer;
  display: grid; place-items: center; box-shadow: var(--shadow); z-index: 20;
  transition: transform 0.25s;
}
.fab:active { transform: scale(0.88) rotate(45deg); }

/* ===== Настройки ===== */
.settings {
  position: fixed; inset: 0; z-index: 150;
  background: var(--bg3); padding: 40px 24px;
  transform: translateX(100%); transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto;
}
.settings.open { transform: translateX(0); }
.settings h2 { font-size: 1.8rem; margin-bottom: 28px; }
.setting-row { display: flex; align-items: center; justify-content: space-between; padding: 18px 0; border-bottom: 1px solid var(--border); }
.theme-switch { display: flex; gap: 10px; }
.theme-switch button {
  width: 46px; height: 46px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--glass);
  font-size: 1.3rem; cursor: pointer; transition: transform 0.2s;
}
.theme-switch button:active { transform: scale(0.9); }
.close-settings {
  margin-top: 36px; width: 100%; padding: 16px; border-radius: 18px;
  border: none; background: var(--accent); color: #fff;
  font-size: 1rem; font-weight: 600; cursor: pointer;
}
</style>
</head>
<body data-theme="dark">

<!-- Экран блокировки -->
<div class="lock" id="lockScreen">
  <div class="lock-time" id="lockTime">00:00</div>
  <div class="lock-date" id="lockDate"></div>
  <div class="lock-hint">Свайп вверх, чтобы разблокировать</div>
</div>

<!-- Главный экран -->
<div class="screen-container">
  <div class="pages-wrapper" id="pagesWrapper">
    <!-- Страница 1 -->
    <div class="page">
      <section class="widgets">
        <div class="widget widget-clock">
          <div class="widget-time" id="wTime">00:00</div>
          <div class="widget-date" id="wDate"></div>
        </div>
        <div class="widget">
          <div class="w-icon" id="batteryIcon">🔋</div>
          <div><div class="w-temp" id="batteryLevel">—%</div><div class="w-city" id="batteryStatus">Батарея</div></div>
        </div>
      </section>
      <main class="app-grid" id="gridPage1"></main>
    </div>
    <!-- Страница 2 -->
    <div class="page">
      <main class="app-grid" id="gridPage2"></main>
    </div>
  </div>
  
  <div class="page-dots" id="dots"></div>
</div>

<!-- Док -->
<div class="dock-wrapper">
  <nav class="dock" id="dock"></nav>
</div>

<!-- Поиск -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <span>🔍</span>
    <input type="search" id="searchInput" placeholder="Поиск приложений…" autocomplete="off">
    <span id="closeSearch" style="cursor:pointer;padding:8px">✖</span>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<button class="fab" id="settingsBtn">⚙️</button>

<!-- Настройки -->
<div class="settings" id="settingsPanel">
  <h2>Настройки</h2>
  <div class="setting-row">
    <span>Тема</span>
    <div class="theme-switch">
      <button data-theme="dark">🌙</button>
      <button data-theme="light">☀️</button>
      <button data-theme="amoled">🖤</button>
    </div>
  </div>
  <button class="close-settings" id="closeSettings">Закрыть</button>
</div>

<script>
// ===== Данные =====
let allApps=[];
try{ if(window.AndroidLauncher) allApps=JSON.parse(AndroidLauncher.getApps()); }catch(e){}

// Фоллбэк для теста в браузере
if(!allApps.length) {
  allApps = [
    {name:'YouTube', pkg:'com.google.android.youtube'}, {name:'Chrome', pkg:'com.android.chrome'},
    {name:'Google', pkg:'com.google'}, {name:'Камера', pkg:'com.android.camera'},
    {name:'Часы', pkg:'com.android.deskclock'}, {name:'Настройки', pkg:'com.android.settings'},
    {name:'Telegram', pkg:'org.telegram.messenger'}, {name:'WhatsApp', pkg:'com.whatsapp'},
    {name:'Spotify', pkg:'com.spotify.music'}, {name:'GitHub', pkg:'com.github.android'}
  ];
}

const emojiMap={youtube:'▶️',google:'🔍',telegram:'✈️',whatsapp:'💬',github:'🐙',chrome:'🌐',camera:'📷',settings:'⚙️',clock:'⏰',music:'🎵'};
function getEmoji(p){p=p.toLowerCase();for(const k in emojiMap)if(p.includes(k))return emojiMap[k];return '📱'}

// ===== Часы =====
function updateClock(){
  const n=new Date();
  const t=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');
  const d=n.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('lockTime').textContent=t;
  document.getElementById('lockDate').textContent=d;
  document.getElementById('wTime').textContent=t;
  document.getElementById('wDate').textContent=d;
}
updateClock();setInterval(updateClock,1000);

// ===== Батарея =====
function updateBattery(){
  if(!window.AndroidLauncher) return;
  try{
    const l=AndroidLauncher.getBatteryLevel();
    const c=AndroidLauncher.isCharging();
    document.getElementById('batteryLevel').textContent=l+'%';
    document.getElementById('batteryStatus').textContent=c?'Заряжается':'Батарея';
    document.getElementById('batteryIcon').textContent=c?'⚡':(l>50?'🔋':l>20?'🪫':'🪫');
  }catch(e){}
}
updateBattery();setInterval(updateBattery,30000);

// ===== Рендер иконок =====
function createIconHtml(app){
  return app.icon ? `<img src="data:image/png;base64,${app.icon}" alt="">` : `<span class="fallback">${getEmoji(app.pkg)}</span>`;
}

// Разбиваем приложения на 2 страницы (по 24 на страницу)
const page1 = allApps.slice(0, 24);
const page2 = allApps.slice(24);

function renderGrid(containerId, list) {
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  list.forEach((app, i) => {
    const el = document.createElement('div');
    el.className = 'app-item';
    el.style.animationDelay = (i * 0.03) + 's';
    el.innerHTML = `<div class="app-icon">${createIconHtml(app)}</div><div class="app-name">${app.name}</div>`;
    el.onclick = () => { if(window.AndroidLauncher) AndroidLauncher.launchApp(app.pkg); };
    container.appendChild(el);
  });
}
renderGrid('gridPage1', page1);
renderGrid('gridPage2', page2);

// Док
function renderDock(list) {
  const dock = document.getElementById('dock');
  dock.innerHTML = '';
  list.slice(0, 4).forEach(app => {
    const el = document.createElement('div');
    el.className = 'app-item';
    el.innerHTML = `<div class="app-icon">${createIconHtml(app)}</div>`;
    el.onclick = () => { if(window.AndroidLauncher) AndroidLauncher.launchApp(app.pkg); };
    dock.appendChild(el);
  });
}
renderDock(page1);

// ===== Свайпы страниц =====
let currentPage = 0;
const totalPages = 2;
const wrapper = document.getElementById('pagesWrapper');
const dotsContainer = document.getElementById('dots');

for(let i=0; i<totalPages; i++){
  const dot = document.createElement('div');
  dot.className = 'page-dot' + (i===0?' active':'');
  dotsContainer.appendChild(dot);
}

let touchStartX = 0;
let touchEndX = 0;
wrapper.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, {passive:true});
wrapper.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  handleSwipe();
}, {passive:true});

function handleSwipe() {
  const diff = touchStartX - touchEndX;
  if (diff > 50 && currentPage < totalPages - 1) {
    currentPage++;
    updateSwipe();
  } else if (diff < -50 && currentPage > 0) {
    currentPage--;
    updateSwipe();
  }
}

function updateSwipe() {
  wrapper.style.transform = `translateX(-${currentPage * 100}vw)`;
  document.querySelectorAll('.page-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === currentPage);
  });
}

// ===== Поиск =====
const overlay = document.getElementById('searchOverlay');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

function openSearch() {
  overlay.classList.add('open');
  setTimeout(() => searchInput.focus(), 100);
}
function closeSearch() {
  overlay.classList.remove('open');
  searchInput.value = '';
  searchResults.innerHTML = '';
}

document.getElementById('closeSearch').onclick = closeSearch;
overlay.addEventListener('click', e => { if(e.target === overlay) closeSearch(); });

searchInput.addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  if(!q) { searchResults.innerHTML = ''; return; }
  const filtered = allApps.filter(a => a.name.toLowerCase().includes(q));
  searchResults.innerHTML = '';
  filtered.forEach(app => {
    const el = document.createElement('div');
    el.className = 'app-item';
    el.innerHTML = `<div class="app-icon">${createIconHtml(app)}</div><div class="app-name">${app.name}</div>`;
    el.onclick = () => { if(window.AndroidLauncher) AndroidLauncher.launchApp(app.pkg); closeSearch(); };
    searchResults.appendChild(el);
  });
});

// Вызов поиска свайпом вниз от верхнего края (для простоты — по кнопке или тапу на пустое место)
// Пока привяжем к кнопке "Поиск", которой нет, поэтому откроем по долгому тапу на виджете:
document.querySelector('.widget-clock').addEventListener('contextmenu', e => { e.preventDefault(); openSearch(); });

// ===== Настройки =====
document.getElementById('settingsBtn').onclick = () => document.getElementById('settingsPanel').classList.add('open');
document.getElementById('closeSettings').onclick = () => document.getElementById('settingsPanel').classList.remove('open');
document.querySelectorAll('[data-theme]').forEach(b => {
  b.onclick = () => document.body.dataset.theme = b.dataset.theme;
});

// ===== Экран блокировки =====
let lockTouchY = 0;
const lock = document.getElementById('lockScreen');
lock.addEventListener('touchstart', e => lockTouchY = e.changedTouches[0].screenY, {passive:true});
lock.addEventListener('touchend', e => {
  if(lockTouchY - e.changedTouches[0].screenY > 50) lock.classList.add('hidden');
}, {passive:true});
lock.addEventListener('click', () => lock.classList.add('hidden')); // Для теста в браузере

// Обработка кнопки "Назад" на Android
window.onLauncherBack = () => {
  document.getElementById('settingsPanel').classList.remove('open');
  closeSearch();
  lock.classList.remove('hidden');
};
</script>
</body>
</html>
